rerun-incomplete: true
use-conda: true
use-singularity: true

# Safe floor: 8 cores and 64 GB, small enough that a run started without a
# tuned profile does not starve a shared machine. 64 GB is the
# smallest budget that still admits the largest single jobs (xengsort 32 GB,
# MarkDuplicates 30 GB). For a real run, copy this directory to
# profiles/<name>/ (gitignored), raise cores, mem_mb and io_heavy together, and
# launch with ./launch.sh --workflow-profile <name>.
cores: 8

default-resources:
  mem_mb: 4000

# io_heavy caps the rules that write a whole BAM (bwa_map, mark_duplicates,
# sort_bam, apply_base_recalibration, cap_manta_bam_quality), which each declare
# io_heavy=1. Their memory tiers alone would let several run at once; on the
# spinning-disk array concurrent whole-BAM rewrites turn into seek thrash rather
# than throughput. Raise it on NVMe, lower it on a single disk.
resources:
  mem_mb: 65536
  io_heavy: 2

# Adds jobid, rule_name, wildcards, params, threads, cpu_usage, resources and
# input_size_mb to every benchmark TSV, so a declared mem_mb and the max_rss it
# was measured against sit in the same row.
benchmark-extended: true

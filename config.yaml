samplesheet: "samplesheet_test_small.csv"
telegram_bot_env: "~/.telegram_bot.env"  # Path to .telegram_bot.env file; leave empty to disable notifications
run_id: "dev test"            # Human-readable label prepended to Telegram notifications

# Container images (pinned). Must match WES-PON-smk so PON normals and caller
# tumors are preprocessed by the identical GATK build (byte-identical BAMs).
containers:
  gatk: "docker://broadinstitute/gatk:4.6.2.0"
  vep: "docker://ensemblorg/ensembl-vep:release_116.0"
  cnvkit: "docker://etal/cnvkit:0.9.14"
  delly: "docker://dellytools/delly:v2.5.1"

# Each probe type points at the original Agilent kit BED files (header lines and
# all; GATK tools and mosdepth skip browser/track, index_bed strips them):
#   covered_bedfile        — the "Covered" BED (probe regions). Primary interval
#                            set: BQSR --intervals, mosdepth, Mutect2 intervals.
#                            Matches the WES-PON-smk covered_bedfile.
#   target_regions_bedfile — the "Regions" BED. Reserved (HsMetrics TARGET); no
#                            consumer in this pipeline yet.
probe_configs:
  "V6+UTR":
    library_prep: "SureSelectV6UTR"
    covered_bedfile:        "/mnt/data/NGS/refs/SureSelectHumanAllExon/V6UTR/S07604624_Covered.bed"
    target_regions_bedfile: "/mnt/data/NGS/refs/SureSelectHumanAllExon/V6UTR/S07604624_Regions.bed"
    cnvkit_targets:     "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/cnvkit/SureSelectV6UTR/targets.bed"
    cnvkit_antitargets: "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/cnvkit/SureSelectV6UTR/antitargets.bed"
  "V8+UTR":
    library_prep: "SureSelectV8UTR"
    covered_bedfile:        "/mnt/data/NGS/refs/SureSelectHumanAllExon/V8UTR/S33613271_Covered.bed"
    target_regions_bedfile: "/mnt/data/NGS/refs/SureSelectHumanAllExon/V8UTR/S33613271_Regions.bed"
    cnvkit_targets:     "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/cnvkit/SureSelectV8UTR/targets.bed"
    cnvkit_antitargets: "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/cnvkit/SureSelectV8UTR/antitargets.bed"

refs:
  # Absolute paths to reference directory:
  path: "/mnt/data/NGS/refs"
  # Absolute paths to reference files:
  ## Genomes
  genome_human: "/mnt/data/NGS/refs/broad/Homo_sapiens_assembly38.fasta"
  genome_host: "/mnt/data/NGS/refs/mm39/mm39.fa"
  ## BQSR
  known_sites:
    - "/mnt/data/NGS/refs/broad/Homo_sapiens_assembly38.dbsnp138.vcf"
    - "/mnt/data/NGS/refs/broad/Homo_sapiens_assembly38.known_indels.vcf.gz"
    - "/mnt/data/NGS/refs/broad/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"
  ## Mutect2
  germline_resource: "/mnt/data/NGS/refs/gatk-BP-somatic-hg38/af-only-gnomad.hg38.vcf.gz"
  ## Contamination (GetPileupSummaries / CalculateContamination)
  contamination_resource: "/mnt/data/NGS/refs/gatk-BP-somatic-hg38/small_exac_common_3.hg38.vcf.gz"
  ## VEP cache (INSTALL.pl --CACHEDIR is the parent dir; VEP resolves
  ## <dir_cache>/<species>/<cache_version>_<assembly> itself)
  vep_cache:
    dir: "/mnt/data/NGS/refs/vep_cache/GRCh38"
    species: "homo_sapiens"
    assembly: "GRCh38"
    cache_version: 116
  ## Predownloaded AnnotSV cache
  annotsv_annotations:
    genome_build: "GRCh38"
    path: "/mnt/data/NGS/refs/annotsv/AnnotSV_annotations"
  purecn:
    genome: "hg38"
    # UCSC Simple Repeats (Tandem Repeats Finder) track, hg38. See README
    # "Reference files" section for sourcing.
    snp_blacklist: "/mnt/data/NGS/refs/UCSC/hg38_simpleRepeats.bed"
  ## Somalier (sample-swap / sex QC)
  somalier_sites: "/mnt/data/NGS/refs/somalier/sites.hg38.vcf.gz"

params:
    xengsort:
      index_size: 4500000000
      index_fill: 0.88
      index_k: 25
      chunksize: 16.0
      prefetch: 1
    cnvkit:
      filter_ci: false  # Set to true to enable segments filtering based on CI
    cnv:
      # Purity/ploidy for cnvkit_call, resolved per tumor by
      # resolve_purity_source (purecn.smk) in priority: (1) samplesheet
      # tumor_fraction when known; (2) PureCN's estimate if it ran, didn't fail,
      # and its ONLY flag is POOR GOF; (3) else assume pure (purity 1).
      # use_purecn_purity=false disables step 2 (known-or-assume-pure only), the
      # rollback path. PureCN still runs regardless, so its numbers stay in the
      # report for comparison even when unused.
      use_purecn_purity: true
    fastp:
      # adds sequence-based PE adapter detection as a backstop to R1/R2 overlap analysis
      detect_adapter_for_pe: true
    bqsr:
      interval_padding: 100
    delly:
      # DELLY short-read recommendations (per the DELLY author): exclude
      # telomeres/centromeres/unplaced contigs and filter input reads stringently.
      # DELLY is the confirmatory caller in the Manta consensus, so favour
      # precision. Leave exclude empty to omit -x. See README "Reference files"
      # for sourcing the hg38 exclude template.
      exclude: "/mnt/data/NGS/refs/delly/human.hg38.excl.tsv"
      map_qual: 20        # -q  min. paired-end mapping quality (default 1)
      mad_cutoff: 15      # -s  insert-size MAD cutoff, deletions only (default 9)
      min_clique_size: 5  # -z  min. PE/SR clique size; raise for high-coverage (default 2)
      # SURVIVOR merge of Manta + DELLY SV calls (consensus).
      survivor_max_dist: 1000  # max breakpoint distance (bp) to call two SVs the same
      survivor_min_size: 0     # min SV size to keep in the merge (0 = no size filter)
      # Drop megabase intra-chromosomal SVs from the consensus before annotation:
      # WES SV callers (esp. DELLY off-target split/PE reads) produce spurious
      # multi-Mb INV/DUP that span hundreds of genes; large CNVs are covered by
      # CNVkit. Translocations (BND) are never size-filtered. 0 disables the cap.
      max_sv_size: 3000000
    somalier:
      # Relatedness/swap QC thresholds (report-only, no DAG gating). Applied by
      # somalier_summarise over the cohort pairs table. Defaults tuned to
      # observed within-patient spread (LOH/aneuploidy depress relatedness, but
      # ibs0 stays ~0 within an individual; a true swap drives ibs0 up).
      ibs0_frac_max: 0.005     # within-patient FAIL when ibs0/n exceeds this
      relatedness_warn: 0.85   # within-patient WARN when relatedness below this
      unrelated_max: 0.30      # cross-patient FAIL when relatedness exceeds this

# Built by WES-PON-smk from all current normals, per capture kit.
panel_of_normals:
  path: "/mnt/data/NGS/WES/PON/WES-PON-smk"
  cnvkit:
    cnvkit_ref_m:
      "V6+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/cnvkit/SureSelectV6UTR/reference_m.cnn"
      "V8+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/cnvkit/SureSelectV8UTR/reference_m.cnn"
    cnvkit_ref_f:
      "V6+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/cnvkit/SureSelectV6UTR/reference_f.cnn"
      "V8+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/cnvkit/SureSelectV8UTR/reference_f.cnn"
  mutect2:
    "V6+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/mutect2/SureSelectV6UTR/pon.vcf.gz"
    "V8+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/mutect2/SureSelectV8UTR/pon.vcf.gz"
  purecn:
    normaldb_m:
      "V6+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/purecn/SureSelectV6UTR/normalDB_SureSelectV6UTR_m_hg38.rds"
      "V8+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/purecn/SureSelectV8UTR/normalDB_SureSelectV8UTR_m_hg38.rds"
    normaldb_f:
      "V6+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/purecn/SureSelectV6UTR/normalDB_SureSelectV6UTR_f_hg38.rds"
      "V8+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/purecn/SureSelectV8UTR/normalDB_SureSelectV8UTR_f_hg38.rds"
    mapping_bias_m:
      "V6+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/purecn/SureSelectV6UTR/mapping_bias_SureSelectV6UTR_m_hg38.rds"
      "V8+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/purecn/SureSelectV8UTR/mapping_bias_SureSelectV8UTR_m_hg38.rds"
    mapping_bias_f:
      "V6+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/purecn/SureSelectV6UTR/mapping_bias_SureSelectV6UTR_f_hg38.rds"
      "V8+UTR": "/mnt/data/NGS/WES/PON/WES-PON-smk/results/PON/purecn/SureSelectV8UTR/mapping_bias_SureSelectV8UTR_f_hg38.rds"

tumor_only:
  af_threshold: 0.001  # Filter variants with population AF > this

resources:
  threads: 16
  java_max_gb: 128
  java_min_gb: 32
  mem_mb: 163840       # java_max_gb + 25% non-heap overhead, for scheduler mem_mb tracking
  manta_max_gb: 128
  manta_mem_mb: 163840 # manta_max_gb + 25% overhead, for scheduler mem_mb tracking
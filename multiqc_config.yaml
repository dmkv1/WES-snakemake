# Consolidate each sample's MultiQC rows (mirrors WES-PON-smk):
#   - fastp/fastqc rows are per lane ({sample}.{lane}); "_fastp" is stripped so
#     the fastp row keeps the {sample}.{lane} name instead of fastp's read guess.
#   - MarkDuplicates gathers per-lane inputs named {sample}.{lane}.sorted.bam;
#     the regex collapses that suffix so the dup-metrics row lands on {sample}.
use_filename_as_sample_name:
  - fastp
extra_fn_clean_exts:
  - "_fastp"
  - type: regex
    pattern: "\\.L\\d+\\.sorted$"
  - ".sorted"

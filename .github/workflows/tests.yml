name: tests

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The suite is pure Python. It imports workflow/scripts directly and
      # needs neither Snakemake nor a container.
      - name: Install test dependencies
        run: pip install pandas pyyaml pytest pytest-cov "genbadge[coverage]"

      - name: Run tests
        run: pytest --cov=workflow/scripts --cov-report=xml --cov-report=term

      # The badge is committed to the repository, so the README renders it
      # without a third-party service. Only the default branch updates it.
      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        run: |
          mkdir -p .github/badges
          genbadge coverage -i coverage.xml -o .github/badges/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        run: |
          if [ -z "$(git status --porcelain -- .github/badges/coverage.svg)" ]; then
            echo "Badge unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "Update coverage badge [skip ci]"
          git push
